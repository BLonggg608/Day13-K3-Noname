alerts:
  - name: api_latency_p95_high
    severity: warning
    condition: latency_p95_ms > 3000 for 10m
    type: symptom-based
    owner: Metrics & Alerting
    runbook: docs/alerts.md#alert-1
  - name: api_error_rate_high
    severity: critical
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: Metrics & Alerting
    runbook: docs/alerts.md#alert-2
  - name: ai_cost_or_quality_breach
    severity: warning
    condition: daily_cost_usd > 2.5 or quality_score_avg < 0.75 for 15m
    type: symptom-based
    owner: Metrics & Alerting
    runbook: docs/alerts.md#alert-3
